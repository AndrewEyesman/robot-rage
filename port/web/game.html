<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Phones and tablets (src/mobile.ts): no zooming the game; desktop browsers ignore these. The
         manifest is linked only in touch mode, so desktop Chrome offers no "Install app". -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Robot Rage" />
    <link rel="apple-touch-icon" href="/assets/app-icon-180.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png" />
    <title>Robot Rage 2: Rearmed</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #stage { position: absolute; inset: 0; touch-action: none; user-select: none; }
      /* In the black bars beside (or under) the 4:3 stage only: hidden when the window has none.
         Settings (src/settings-panel.ts) goes before Privacy. */
      #links { display: none; position: fixed; right: 8px; bottom: 6px; z-index: 1; gap: 14px; font: 12px sans-serif; color: #555; }
      #links a { color: inherit; text-decoration: none; }
      #links > :hover { color: #aaa; }
      @media (min-aspect-ratio: 3/2), (max-aspect-ratio: 1/1) { #links { display: flex; } }
      /* The credit, in the left bar (wrapped to its width) or the bar under the stage; not in
         the arena, whose widescreen view and touch controls use the bars. */
      #credit { display: none; position: fixed; left: 8px; bottom: 6px; z-index: 1; max-width: calc((100vw - 400vh / 3) / 2 - 16px); font: 12px sans-serif; color: #555; }
      @media (min-aspect-ratio: 16/10) { #credit { display: block; } }
      /* Under the stage it shares the bottom line with #links (about 100px): wrap short of them. */
      @media (max-aspect-ratio: 1/1) { #credit { display: block; max-width: calc(100vw - 130px); } }
      html.in-arena #credit { display: none; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="credit">Unofficial fan server</div>
    <div id="links"><a id="privacy" href="/privacy.html" target="_blank" rel="noopener">Privacy</a></div>
    <script type="module" src="/src/game.ts"></script>
  </body>
</html>
