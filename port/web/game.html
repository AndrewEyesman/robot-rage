<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Phones and tablets (src/mobile.ts): no zooming the game; desktop browsers ignore these. The
         manifest is linked only in touch mode, so desktop Chrome offers no "Install app". -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Robot Rage 2" />
    <link rel="apple-touch-icon" href="/assets/login013_/bitmaps/1-76.png" />
    <title>Robot Rage 2: Rearmed</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #stage { position: absolute; inset: 0; touch-action: none; user-select: none; }
      /* In the black bars beside (or under) the 4:3 stage only: hidden when the window has none. */
      #privacy { display: none; position: fixed; right: 8px; bottom: 6px; z-index: 1; font: 12px sans-serif; color: #555; text-decoration: none; }
      #privacy:hover { color: #aaa; }
      @media (min-aspect-ratio: 3/2), (max-aspect-ratio: 1/1) { #privacy { display: block; } }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <a id="privacy" href="/privacy.html" target="_blank" rel="noopener">Privacy</a>
    <script type="module" src="/src/game.ts"></script>
  </body>
</html>
