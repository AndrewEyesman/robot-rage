<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Robot Rage</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #bbb; font: 14px system-ui, sans-serif; }
    main { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
    footer { opacity: 0.6; }
  </style>
</head>
<body>
<main>
  <div id="stage"></div>
  <footer>Robot Rage 2 and all its assets are © Raketspel / Miniclip. This is an unofficial fan server, not affiliated with either.</footer>
</main>
<script>
  // Every tab gets a made-up private "IP". The server hands it to opponents
  // over IRC, they connectToNetServer() to it on port 1626, and the resolver
  // below turns that into a relay connection on this server.
  //
  // The game's "external IP" (sw1) is the same for every tab: it believes all
  // players sit behind one router, so they see each other in the lobby (it
  // hides players behind other routers) and the challenged player hosts.
  const SHARED_EXTERNAL_IP = "10.0.0.1";
  const myAddress = sessionStorage.rrAddress ||= [10, 1 + Math.random() * 254 | 0,
    Math.random() * 256 | 0, 1 + Math.random() * 254 | 0].join(".");

  const wsBase = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`;
  const IRC_PORTS = new Set([8777, 8778, 8779, 8780, 8781]);

  const resolveSocketUrl = (host, port) => {
    if (IRC_PORTS.has(port)) return `${wsBase}/ws/irc?addr=${encodeURIComponent(myAddress)}`;
    if (port === 1626) return `${wsBase}/ws/p2p/connect?addr=${encodeURIComponent(host)}`;
    return "";
  };
  window.dirplayerResolveSocketUrl = resolveSocketUrl;
  // The login screen fetches its country lookup from a hardcoded Shockplay URL;
  // answer it from this server instead.
  const SHOCKPLAY_PHP = "http://miniclip2.shockplay.com/php/";
  const fetchOriginal = window.fetch;
  window.fetch = (input, init) => {
    const url = typeof input === "string" ? input : input?.url;
    if (url?.startsWith(SHOCKPLAY_PHP)) input = `/api/${url.slice(SHOCKPLAY_PHP.length)}`;
    return fetchOriginal.call(window, input, init);
  };

  // Page functions the original Miniclip site provided via gotoNetPage("javascript:...").
  window.openHelpPop = () => {};
  window.openPassPop = () => console.info("Password resets: ask whoever runs this server.");
  window.subscribeToNewsletter = () => {};

  window.dirplayerResolveListenUrl = (userID) =>
    `${wsBase}/ws/p2p/listen?addr=${encodeURIComponent(myAddress)}&user=${encodeURIComponent(userID)}`;

  const embed = document.createElement("embed");
  Object.assign(embed, { src: "game/wrapper_robotragerearmed.dcr", width: 800, height: 600 });
  embed.setAttribute("type", "application/x-director");
  embed.setAttribute("sw1", SHARED_EXTERNAL_IP);
  document.getElementById("stage").append(embed);

  // The player takes keys only while its stage element has focus. If focus has
  // fallen back to the page (nothing focused), give it back to the stage and
  // hand it the key, so driving never needs an extra click.
  for (const type of ["keydown", "keyup"]) {
    window.addEventListener(type, (e) => {
      const active = document.activeElement;
      if (active && active !== document.body) return;
      const stage = document.querySelector("#stage [tabindex]");
      if (!stage) return;
      stage.focus();
      const copy = new KeyboardEvent(type, e);
      Object.defineProperty(copy, "keyCode", { value: e.keyCode });
      e.preventDefault();
      e.stopImmediatePropagation();
      stage.dispatchEvent(copy);
    }, true);
  }
</script>
<!-- No fullscreen button over the stage: the game never had one. -->
<script src="dirplayer/dirplayer-polyfill.js" data-disable-fullscreen-button></script>
<script>
  // The polyfill (PR #244 base) installs its own socket resolver over the page's, driven
  // by an empty socketProxy config, so every socket resolved to "" and the lobby could
  // never reach IRC. Put the page's resolver back.
  window.dirplayerResolveSocketUrl = resolveSocketUrl;
</script>
</body>
</html>
